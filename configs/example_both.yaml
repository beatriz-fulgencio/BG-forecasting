# Minimal paired example: run regular and transfer training from one config.
# OhioT1DM must be downloaded separately.
schema_version: 1

experiment:
  name: example_both
  description: Two-patient GRU forecast comparing regular and transfer training
  author: Researcher Name

data:
  dataset: ohiot1dm
  root: data
  version: "2020"
  patients: [540, 544]
  train_ratio: 0.9
  validation_ratio: 0.1

preprocessing:
  window_size: 12
  prediction_horizon: 6
  sampling_rate: 5
  unimodal: true
  include_feature_engineering: true
  normalization: standardize

model:
  type: gru
  architecture:
    hidden_size: 32
    num_layers: 1
    dropout: 0.0
    batch_first: true

training:
  mode: both
  seeds: [42]
  epochs: 1
  pretrain_epochs: 2
  finetune_epochs: 2
  batch_size: 32
  learning_rate: 0.001
  early_stopping_patience: 3
  device: auto

evaluation:
  metrics: [mae, rmse]

output:
  directory: results/experiments
  save_model: false
  save_predictions: true
  generate_plots: false
  export_format: [json, csv]
