# Versioned configuration template for the blood glucose forecasting benchmark.
# OhioT1DM is not distributed with this repository; see README.md for setup.
schema_version: 1

experiment:
  name: default_gru_experiment
  description: GRU baseline for 30-minute blood glucose forecasting
  author: Researcher Name

data:
  dataset: ohiot1dm
  root: data
  version: "2020"
  patients: all
  train_ratio: 0.9
  validation_ratio: 0.1

preprocessing:
  window_size: 12
  prediction_horizon: 6
  sampling_rate: 5
  unimodal: false
  include_feature_engineering: true
  normalization: standardize

model:
  type: gru
  architecture:
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
    batch_first: true

training:
  # Required. Options: regular, transfer, both.
  mode: regular
  epochs: 100
  pretrain_epochs: 50
  finetune_epochs: 25
  batch_size: 32
  learning_rate: 0.001
  early_stopping_patience: 10
  # One independently tracked subrun per seed, for example [42, 43, 44].
  seeds: [42]
  device: auto

evaluation:
  metrics: [mae, rmse, mape, mard, tir, clarke_ega, parkes_ega]

output:
  directory: results/experiments
  save_model: true
  save_predictions: true
  generate_plots: true
  export_format: [json, csv]
