# Default configuration template for blood glucose forecasting benchmark
# Copy and modify this file for your experiments

experiment:
  name: "default_experiment"
  description: "Default configuration template"
  author: "Beatriz Fulgencio"
  date: "2025-09-09"

data:
  dataset: "ohiot1dm"
  subjects: "all"
  split_strategy: "temporal" # Temporal split for time series data
  train_ratio: 0.8
  val_ratio: 0.20
  test_ratio: 1.0 # 100% of the test data for testing

preprocessing: #TODO
  imputation_method: "linear" # Linear interpolation for missing values 
  outlier_threshold: 3.0
  normalization: "standardize"
  window_size: 12
  prediction_horizon: 6 # 6 time steps (30 minutes)
  sampling_rate: 5 # 5 minutes

model:
  type: "lstm"
  architecture:
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
  hyperparameters:
    learning_rate: 0.001
    batch_size: 32
    epochs: 100
    early_stopping_patience: 10

evaluation:
  metrics:
    - "mae"
    - "rmse"
    - "mape"
    - "clarke_ega"
  cross_validation:
    enabled: false
    folds: 5
    strategy: "time_series"
    
output:
  save_model: true
  save_predictions: true
  generate_plots: true
  export_format: ["csv", "json"]