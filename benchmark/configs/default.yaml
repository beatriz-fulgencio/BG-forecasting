data:
  batch_size: 32
  dataset: ohiot1dm
  patient_ids:
  - 540
  - 544
  - 552
  - 567
  - 584
  - 596
  prediction_horizon: 6
  preprocessing:
    interpolate_missing: true
  sequence_length: 12
  version: '2018'
evaluation:
  cross_validation:
    enabled: false
    folds: 5
  metrics:
  - mae
  - rmse
  - mard
  - tir
  - clarke_error_grid
  - parkes_error_grid
experiment:
  description: Default benchmarking experiment
  name: default_experiment
  tags: []
  tracking:
    enabled: true
    save_models: true
    save_predictions: true
models:
  gru:
    dropout: 0.2
    hidden_size: 64
    num_layers: 2
  lstm:
    dropout: 0.2
    hidden_size: 64
    num_layers: 2
  rnn:
    dropout: 0.2
    hidden_size: 64
    num_layers: 2
paths:
  data_root: data
  logs: logs
  processed_data: processed_data
  results: results
  saved_models: saved_models
system:
  device: auto
  num_workers: 4
  precision: float32
  random_seed: 42
training:
  early_stopping:
    min_delta: 0.001
    patience: 10
  epochs: 50
  learning_rate: 0.001
  transfer_learning:
    enabled: true
    fine_tune_epochs: 25
    freeze_layers:
    - embedding
    source_patients:
    - 540
    - 544
    target_patients:
    - 552
    - 567
    - 584
    - 596
  weight_decay: 1.0e-05
