# Default configuration template for blood glucose forecasting benchmark
# Copy and modify this file for your experiments

experiment:
  name: "default_experiment"
  description: "Default configuration template"
  author: "Your Name"
  date: "YYYY-MM-DD"

data:
  dataset: "ohiot1dm"
  subjects: "all"
  split_strategy: "temporal"
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  
preprocessing:
  imputation_method: "linear"
  outlier_threshold: 3.0
  normalization: "standardize"
  window_size: 12
  prediction_horizon: 6
  sampling_rate: 5

model:
  type: "lstm"
  architecture:
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
  hyperparameters:
    learning_rate: 0.001
    batch_size: 32
    epochs: 100
    early_stopping_patience: 10

evaluation:
  metrics:
    - "mae"
    - "rmse"
    - "mape"
    - "clarke_ega"
  cross_validation:
    enabled: false
    folds: 5
    strategy: "time_series"
    
output:
  save_model: true
  save_predictions: true
  generate_plots: true
  export_format: ["csv", "json"]