# Traditional ML Model Example - Random Forest
experiment:
  name: "random_forest_30min_prediction"
  description: "Random Forest model for 30-minute BG prediction"
  author: "Researcher Name"
  date: "2024-01-01"

data:
  dataset: "ohiot1dm"
  subjects: ["559", "563", "570"]  # Specific subjects
  split_strategy: "subject_wise"
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  
preprocessing:
  imputation_method: "forward_fill"
  outlier_threshold: 4.0
  normalization: "minmax"
  window_size: 18    # 90 minutes of history (5-min sampling)
  prediction_horizon: 6  # 30 minutes ahead
  sampling_rate: 5
  features:
    - "glucose"
    - "glucose_rate_of_change"
    - "time_of_day"
    - "day_of_week"

model:
  type: "random_forest"
  hyperparameters:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 5
    min_samples_leaf: 2
    random_state: 42

evaluation:
  metrics:
    - "mae"
    - "rmse"
    - "mape"
    - "clarke_ega"
  cross_validation:
    enabled: true
    folds: 3
    strategy: "subject_wise"
    
output:
  save_model: true
  save_predictions: true
  generate_plots: true
  export_format: ["csv", "json"]