# Example configuration for blood glucose forecasting benchmark experiment
# This file demonstrates the structure for reproducible experiments

experiment:
  name: "example_lstm_experiment"
  description: "Example LSTM model for 30-minute BG prediction"
  author: "Researcher Name"
  date: "2024-01-01"

data:
  dataset: "ohiot1dm"  # Options: ohiot1dm, replace_bg, tidepool, custom
  subjects: "all"      # "all" or list of subject IDs
  split_strategy: "temporal"  # temporal, random, subject_wise
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  
preprocessing:
  imputation_method: "linear"    # linear, forward_fill, mean
  outlier_threshold: 3.0         # Standard deviations for outlier detection
  normalization: "standardize"   # standardize, minmax, none
  window_size: 12               # Input sequence length (time steps)
  prediction_horizon: 6         # Prediction horizon (time steps)
  sampling_rate: 5              # Minutes between samples

model:
  type: "lstm"                  # lstm, gru, transformer, linear, etc.
  architecture:
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
  hyperparameters:
    learning_rate: 0.001
    batch_size: 32
    epochs: 100
    early_stopping_patience: 10

evaluation:
  metrics:
    - "mae"
    - "rmse" 
    - "mape"
    - "clarke_ega"
    - "time_in_range"
  cross_validation:
    enabled: true
    folds: 5
    strategy: "time_series"
    
output:
  save_model: true
  save_predictions: true
  generate_plots: true
  export_format: ["csv", "json"]