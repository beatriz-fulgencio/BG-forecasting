# Deep Learning Model Example - Transformer
experiment:
  name: "transformer_60min_prediction"
  description: "Transformer model for 60-minute BG prediction with attention"
  author: "Researcher Name"
  date: "2024-01-01"

data:
  dataset: "replace_bg"
  subjects: "all"
  split_strategy: "temporal"
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  
preprocessing:
  imputation_method: "linear"
  outlier_threshold: 3.5
  normalization: "standardize"
  window_size: 24    # 2 hours of history
  prediction_horizon: 12  # 60 minutes ahead
  sampling_rate: 5
  features:
    - "glucose"
    - "insulin"
    - "carbs"
    - "activity"

model:
  type: "transformer"
  architecture:
    d_model: 128
    n_heads: 8
    n_layers: 4
    d_ff: 512
    dropout: 0.1
    max_seq_length: 24
  hyperparameters:
    learning_rate: 0.0001
    batch_size: 64
    epochs: 200
    early_stopping_patience: 15
    optimizer: "adam"
    scheduler: "cosine"

evaluation:
  metrics:
    - "mae"
    - "rmse"
    - "mape"
    - "clarke_ega"
    - "parkes_ega"
    - "time_in_range"
  cross_validation:
    enabled: false
    
output:
  save_model: true
  save_predictions: true
  save_attention_weights: true
  generate_plots: true
  export_format: ["csv", "json", "hdf5"]