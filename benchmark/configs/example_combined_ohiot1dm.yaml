# Real-data cross-release smoke run; download both OhioT1DM releases first.
# The full 12-patient selection is data.version: both, data.patients: all.
schema_version: 1

experiment:
  name: example_gru_cross_release
  description: GRU smoke run with one patient from each OhioT1DM release
  author: Researcher Name

data:
  dataset: ohiot1dm
  root: data
  version: both
  patients: [540, 559]
  train_ratio: 0.9
  validation_ratio: 0.1

preprocessing:
  window_size: 12
  prediction_horizon: 6
  sampling_rate: 5
  unimodal: true
  include_feature_engineering: true
  normalization: standardize

model:
  type: gru
  architecture:
    hidden_size: 32
    num_layers: 1
    dropout: 0.0
    batch_first: true

training:
  mode: both
  seeds: [42]
  epochs: 1
  pretrain_epochs: 1
  finetune_epochs: 1
  batch_size: 64
  learning_rate: 0.001
  early_stopping_patience: 1
  device: auto

evaluation:
  metrics: [mae, rmse]

output:
  directory: results/experiments
  save_model: false
  save_predictions: false
  generate_plots: false
  export_format: [json, csv]
